name: ANT+ Trainer Bridge
version: "0.3.4"
slug: ant_trainer_bridge
description: Passive ANT+ FE-C smart-trainer and heart-rate telemetry bridge to Home Assistant MQTT.
url: https://github.com/deanpemberton/ant-trainer-bridge
arch:
  - aarch64
  - amd64
startup: application
boot: auto
stage: experimental
usb: true
udev: true
init: false
image: ghcr.io/deanpemberton/ant-trainer-bridge
services:
  - mqtt:need
options:
  simulation: true
  mqtt_base_topic: home/trainer
  ant_device_id: 0
  hr_device_id: 0
  active_power_threshold: 20
  active_timeout_seconds: 15
  packet_stale_seconds: 5
schema:
  simulation: bool
  mqtt_base_topic: str
  ant_device_id: int
  hr_device_id: int
  active_power_threshold: int
  active_timeout_seconds: int
  packet_stale_seconds: int
